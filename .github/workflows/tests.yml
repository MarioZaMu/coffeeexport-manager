name: Pruebas automáticas

# Se ejecuta en cada push a main, en cada pull request, a mano desde la pestaña Actions
# y todos los lunes a las 6:00 a. m. (hora de Colombia) para detectar regresiones por cambios de dependencias.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JUnit 5, Mockito, MockMvc, JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas unitarias, de repositorio y de integración con cobertura
        working-directory: backend
        run: mvn -B verify
      - name: Resumen de cobertura
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          filas = list(csv.DictReader(open("target/site/jacoco/jacoco.csv", encoding="utf-8")))
          cubiertas = sum(int(f["LINE_COVERED"]) for f in filas); perdidas = sum(int(f["LINE_MISSED"]) for f in filas)
          print(f"### Cobertura del backend\n\nLíneas cubiertas: **{cubiertas} de {cubiertas + perdidas}** ({cubiertas / (cubiertas + perdidas) * 100:.1f} %)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reportes
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/coffeeexport-backend-*.jar
          retention-days: 1

  frontend:
    name: Frontend (unitarias, integración en Chrome y sistema contra la API)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Instalar dependencias y Chromium
        working-directory: frontend
        run: |
          npm install
          npx playwright-core install --with-deps chromium
      - name: Pruebas unitarias, de integración y de sistema
        working-directory: frontend
        shell: bash   # con pipefail: si una prueba falla, el paso falla aunque la salida pase por tee
        run: npm run test:junit | tee ../resultados-frontend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidencia
          path: |
            resultados-frontend.xml
            frontend/tests/evidence
