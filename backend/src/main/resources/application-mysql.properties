# Perfil "mysql": mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Variables: DB_URL (p. ej. jdbc:mysql://127.0.0.1:3306/coffeeexport), DB_USER, DB_PASSWORD
# El script docs/sprint2/coffeeexport_ddl.sql documenta el esquema; Hibernate lo mantiene alineado con las entidades.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
