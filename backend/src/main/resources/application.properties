# CoffeeExport Manager - configuración por defecto (desarrollo): H2 en modo MySQL, sin instalar nada.
spring.application.name=coffeeexport-backend
server.port=${PORT:8080}

# Base de datos: variables de entorno para MySQL (perfil "mysql"); por defecto H2 en memoria
spring.datasource.url=${DB_URL:jdbc:h2:mem:coffeeexport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RF-02 / RNF-02: la sesión expira a los 30 minutos de inactividad y la cookie no es legible por JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Carga de documentos (RF-20): solo PDF, máximo 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.dir=${STORAGE_DIR:./uploads}

# Reglas de negocio configurables
app.tasa-eur-usd=1.08
app.seed.demo=${SEED_DEMO:true}
app.cors.origenes=${CORS_ORIGENES:http://localhost:*,http://127.0.0.1:*}

server.error.include-message=never
